<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Lobi & Sesli Sohbet</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; background-color: #202225; color: #dcddde; overflow: hidden; display: flex; }
        
        /* GİRİŞ VE LOBİ EKRANLARI */
        #auth-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: #2f3136; position: absolute; z-index: 50; }
        .auth-box { background-color: #36393f; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 320px; text-align: center; }
        .auth-box h2 { color: white; margin-top: 0; margin-bottom: 25px; }
        .auth-box p { color: #b9bbbe; font-size: 14px; margin-bottom: 20px; }
        
        input { width: 90%; padding: 12px; border-radius: 4px; border: 1px solid #202225; background-color: #202225; color: white; margin-bottom: 15px; outline: none; font-size: 14px; }
        button { background-color: #5865F2; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; margin-bottom: 10px; font-size: 14px; }
        button:hover { background-color: #4752C4; }
        
        .btn-green { background-color: #3ba55d; } .btn-green:hover { background-color: #2d7d46; }
        .btn-red { background-color: #ed4245; } .btn-red:hover { background-color: #c9383b; }
        .btn-dark { background-color: #4f545c; color: white; } .btn-dark:hover { background-color: #72767d; }

        /* ARAYÜZ / GÖRÜŞME EKRANI */
        #call-screen { width: 100%; height: 100%; display: none; flex-direction: column; background-color: #000000; position: relative; }
        #call-header { padding: 15px 25px; background-color: #36393f; border-bottom: 1px solid #202225; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        #call-header h2 { margin: 0; color: white; font-size: 16px; }
        
        #controls { display: flex; gap: 10px; align-items: center; }
        #controls select { width: auto; padding: 8px; margin: 0; }
        #controls button { width: auto; margin: 0; padding: 10px 15px; }

        /* EKRAN PAYLAŞIMI */
        #video-container { flex-grow: 1; display: none; justify-content: center; align-items: center; padding: 20px; overflow: hidden; }
        #screen-video { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; }

        /* KULLANICI YUVARLAKLARI */
        #participants-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; gap: 50px; padding: 40px; transition: all 0.3s ease; }
        .participant { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .circle { width: 120px; height: 120px; border-radius: 50%; background-color: #2f3136; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; color: white; border: 4px solid transparent; transition: all 0.2s; }
        .name-tag { background-color: rgba(0, 0, 0, 0.7); padding: 6px 16px; border-radius: 12px; font-size: 14px; color: white; }
        .speaking .circle { border-color: #3ba55d; box-shadow: 0 0 20px rgba(59, 165, 93, 0.8); }

        .minimized-participants { flex-grow: 0 !important; padding: 15px !important; background-color: #18191c; border-top: 1px solid #202225; gap: 20px !important; }
        .minimized-participants .circle { width: 50px; height: 50px; font-size: 18px; border-width: 2px; }
        .minimized-participants .participant { gap: 8px; }
        .minimized-participants .name-tag { font-size: 11px; padding: 3px 8px; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANLARI -->
    <div id="auth-container">
        
        <!-- Ana Menü -->
        <div class="auth-box" id="menu-main">
            <h2>Özel Ses Odası</h2>
            <p>Sunucusuz, şifreli ve doğrudan bağlantı.</p>
            <button onclick="showMenu('menu-create')">Lobi Oluştur</button>
            <button class="btn-green" onclick="showMenu('menu-join')">Lobiye Katıl</button>
        </div>

        <!-- Lobi Oluşturma Ekranı -->
        <div class="auth-box" id="menu-create" style="display: none;">
            <h2>Lobi Oluştur</h2>
            <input type="text" id="create-nick" placeholder="Kullanıcı Adın">
            <input type="password" id="create-pass" placeholder="Lobi Şifresi Belirle">
            <button class="btn-green" id="create-btn" onclick="createLobby()">Oluştur ve Başla</button>
            <button class="btn-dark" onclick="showMenu('menu-main')">Geri Dön</button>
        </div>

        <!-- Lobiye Katılma Ekranı -->
        <div class="auth-box" id="menu-join" style="display: none;">
            <h2>Lobiye Katıl</h2>
            <input type="text" id="join-nick" placeholder="Kullanıcı Adın">
            <input type="password" id="join-pass" placeholder="Lobi Şifresini Gir">
            <button class="btn-green" id="join-btn" onclick="joinLobby()">Lobiye Bağlan</button>
            <button class="btn-dark" onclick="showMenu('menu-main')">Geri Dön</button>
        </div>

    </div>

    <!-- SOHBET EKRANI -->
    <div id="call-screen">
        <div id="call-header">
            <h2 id="current-room-title">Bekleme Odası</h2>
            <div id="controls">
                <button id="mute-btn" onclick="toggleMute()" class="btn-dark">🎙️ Sustur</button>
                <select id="quality-selector">
                    <option value="360">360p (60fps)</option>
                    <option value="480">480p (60fps)</option>
                    <option value="720">720p (60fps)</option>
                    <option value="1080">1080p (60fps)</option>
                    <option value="1440" selected>2K (60fps)</option>
                </select>
                <button id="share-btn" onclick="startScreenShare()" class="btn-green">🖥️ Ekran Paylaş</button>
                <button id="leave-btn" onclick="leaveRoom()" class="btn-red">☎️ Odadan Çık</button>
            </div>
        </div>
        
        <div id="video-container">
            <video id="screen-video" autoplay playsinline></video>
        </div>

        <div id="participants-area">
            <!-- Yuvarlaklar JavaScript ile eklenecek -->
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        const ROOM_PREFIX = "gizli_lobi_";
        let peer = null;
        let myStream = null;
        let currentAudioCall = null;
        let remotePeerId = null; 
        let audioContext = null;
        let isMuted = false;
        let localUsername = "";

        // Menü Geçişleri
        function showMenu(menuId) {
            document.getElementById('menu-main').style.display = 'none';
            document.getElementById('menu-create').style.display = 'none';
            document.getElementById('menu-join').style.display = 'none';
            document.getElementById(menuId).style.display = 'block';
        }

        // Mikrofon İzni Alma
        async function setupMicrophone() {
            if(myStream) return true;
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });
                return true;
            } catch(e) {
                alert("Mikrofon izni alınamadı! Uygulamanın çalışması için mikrofona izin vermelisiniz.");
                return false;
            }
        }

        // LOBİ OLUŞTURAN KİŞİ
        async function createLobby() {
            const nick = document.getElementById('create-nick').value.trim();
            const pass = document.getElementById('create-pass').value.trim();
            if(!nick || !pass) return alert("Kullanıcı adı ve şifre boş bırakılamaz!");

            const btn = document.getElementById('create-btn');
            btn.innerText = "Lobi Kuruluyor...";

            localUsername = nick;
            const hasMic = await setupMicrophone();
            if(!hasMic) { btn.innerText = "Oluştur ve Başla"; return; }

            // Şifreyi Peer ID olarak ayarlıyoruz (Böylece arkadaşın bu şifreyi arayacak)
            peer = new Peer(ROOM_PREFIX + pass);

            peer.on('open', function(id) {
                switchToCallScreen("Lobi: Katılımcı Bekleniyor... (Şifre: " + pass + ")");
            });

            // Arkadaş Lobiye Bağlandığında
            peer.on('call', function(call) {
                if (call.metadata && call.metadata.type === 'screen') {
                    call.answer(); 
                    call.on('stream', function(screenStream) { showScreenVideo(screenStream, false); });
                    call.on('close', hideScreenVideo);
                } else {
                    remotePeerId = call.peer;
                    call.answer(myStream);
                    setupCallEvents(call, call.metadata.callerName);
                }
            });

            peer.on('error', function(err) {
                if(err.type === 'unavailable-id') {
                    alert("Bu şifreyle kurulmuş aktif bir lobi zaten var! Lütfen başka bir şifre belirleyin.");
                    btn.innerText = "Oluştur ve Başla";
                }
            });
        }

        // LOBİYE KATILAN KİŞİ
        async function joinLobby() {
            const nick = document.getElementById('join-nick').value.trim();
            const pass = document.getElementById('join-pass').value.trim();
            if(!nick || !pass) return alert("Kullanıcı adı ve şifre boş bırakılamaz!");

            const btn = document.getElementById('join-btn');
            btn.innerText = "Bağlanılıyor...";

            localUsername = nick;
            const hasMic = await setupMicrophone();
            if(!hasMic) { btn.innerText = "Lobiye Bağlan"; return; }

            peer = new Peer();

            peer.on('open', function(id) {
                switchToCallScreen("Lobiye Bağlanılıyor...");
                
                // Belirtilen şifreyi arayarak lobiye giriyor
                remotePeerId = ROOM_PREFIX + pass;
                const call = peer.call(remotePeerId, myStream, { metadata: { type: 'audio', callerName: localUsername } });
                setupCallEvents(call, "Oda Kurucusu");
            });

            peer.on('error', function(err) {
                if(err.type === 'peer-unavailable') {
                    alert("Bu şifreye ait aktif bir lobi bulunamadı! Şifreyi kontrol edin veya arkadaşınızın lobiyi kurduğundan emin olun.");
                    leaveRoom();
                }
            });
        }

        // Arama Olayları
        function setupCallEvents(call, remoteName) {
            currentAudioCall = call;

            call.on('stream', function(remoteStream) {
                document.getElementById('current-room-title').innerText = remoteName + " odaya katıldı!";
                document.getElementById('remote-audio').srcObject = remoteStream;

                if(!document.getElementById('remote-user')) {
                    addParticipant(remoteName, remoteName.charAt(0).toUpperCase(), 'remote-user');
                    monitorSpeech(remoteStream, 'remote-user');
                }
            });

            call.on('close', leaveRoom);
        }

        // Arayüz Değişiklikleri
        function switchToCallScreen(titleText) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('current-room-title').innerText = titleText;
            
            // Ekranı temizle ve kendi yuvarlağımızı ekle
            document.getElementById('participants-area').innerHTML = "";
            addParticipant(localUsername, localUsername.charAt(0).toUpperCase(), 'local-user');
            monitorSpeech(myStream, 'local-user');
        }

        // Odadan Çıkış (Reset)
        function leaveRoom() {
            if(currentAudioCall) currentAudioCall.close();
            if(peer) peer.destroy();
            hideScreenVideo();
            
            document.getElementById('call-screen').style.display = 'none';
            document.getElementById('auth-container').style.display = 'flex';
            
            document.getElementById('create-btn').innerText = "Oluştur ve Başla";
            document.getElementById('join-btn').innerText = "Lobiye Bağlan";
        }

        // --- EKRAN PAYLAŞIMI VE SUSTURMA KODLARI (Aynı Kaldı) ---
        function toggleMute() {
            isMuted = !isMuted;
            myStream.getAudioTracks()[0].enabled = !isMuted;
            const muteBtn = document.getElementById('mute-btn');
            if (isMuted) { muteBtn.innerText = "🔇 Sesim Kapalı"; muteBtn.style.backgroundColor = "#ed4245"; } 
            else { muteBtn.innerText = "🎙️ Sustur"; muteBtn.style.backgroundColor = "#4f545c"; }
        }

        async function startScreenShare() {
            if (!remotePeerId) return alert("Şu an odada ekranını paylaşabileceğin kimse yok.");
            const res = {
                '360': { w: 640, h: 360 }, '480': { w: 854, h: 480 }, '720': { w: 1280, h: 720 },
                '1080': { w: 1920, h: 1080 }, '1440': { w: 2560, h: 1440 }
            }[document.getElementById('quality-selector').value];

            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: res.w }, height: { ideal: res.h }, frameRate: { ideal: 60, max: 60 } },
                    audio: true
                });
                showScreenVideo(screenStream, true);
                const screenCall = peer.call(remotePeerId, screenStream, { metadata: { type: 'screen' } });
                screenStream.getVideoTracks()[0].onended = () => { screenCall.close(); hideScreenVideo(); };
            } catch (err) { console.error("Ekran paylaşılamadı:", err); }
        }

        function showScreenVideo(stream, isLocal) {
            const videoEl = document.getElementById('screen-video');
            videoEl.srcObject = stream;
            videoEl.muted = isLocal; 
            document.getElementById('video-container').style.display = 'flex';
            document.getElementById('participants-area').classList.add('minimized-participants');
        }

        function hideScreenVideo() {
            document.getElementById('screen-video').srcObject = null;
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('participants-area').classList.remove('minimized-participants');
        }

        function addParticipant(name, initials, id) {
            const area = document.getElementById('participants-area');
            let div = document.createElement('div');
            div.className = 'participant';
            div.id = id;
            div.innerHTML = `<div class="circle">${initials}</div><div class="name-tag">${name}</div>`;
            area.appendChild(div);
        }

        function monitorSpeech(stream, elementId) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            source.connect(analyser); 
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            setInterval(() => {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let average = sum / dataArray.length;

                let el = document.getElementById(elementId);
                if(el) {
                    if (average > 15 && !(elementId === 'local-user' && isMuted)) el.classList.add('speaking');
                    else el.classList.remove('speaking');
                }
            }, 100);
        }
    </script>
</body>
</html>
