<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Sesli Sohbet ve Yayın (Pro)</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: #36393f; color: #dcddde; overflow: hidden; }
        
        /* Sol Menü */
        #sidebar { width: 320px; background-color: #2f3136; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #202225; z-index: 10; overflow-y: auto; }
        #sidebar h3 { color: #96989d; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; margin-top: 15px; border-bottom: 1px solid #40444b; padding-bottom: 5px; }
        
        .info-box { background-color: #202225; padding: 8px; border-radius: 5px; font-family: monospace; color: #3ba55d; margin-bottom: 10px; font-size: 13px; word-break: break-all;}
        input, select { width: 90%; padding: 8px; border-radius: 4px; border: 1px solid #202225; background-color: #202225; color: white; margin-bottom: 8px; outline: none; }
        
        button { background-color: #5865F2; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; margin-bottom: 8px; font-size: 13px; }
        button:hover { background-color: #4752C4; }
        button:disabled { background-color: #4f545c; cursor: not-allowed; }
        
        /* Buton Renkleri */
        .btn-green { background-color: #3ba55d; } .btn-green:hover { background-color: #2d7d46; }
        .btn-red { background-color: #ed4245; } .btn-red:hover { background-color: #c9383b; }
        .btn-dark { background-color: #202225; color: #b9bbbe; } .btn-dark:hover { background-color: #4f545c; color: white; }

        /* Arkadaş Listesi */
        #friends-list { list-style: none; padding: 0; margin: 0; }
        .friend-item { display: flex; justify-content: space-between; align-items: center; background-color: #202225; padding: 8px; border-radius: 4px; margin-bottom: 5px; }
        .friend-item span { font-size: 13px; font-weight: bold; }
        .friend-item button { width: auto; padding: 5px 10px; margin: 0; font-size: 11px; background-color: #3ba55d; }

        /* Arayüz / Ana Ekran */
        #main { flex-grow: 1; display: flex; flex-direction: column; background-color: #000000; position: relative; }
        #call-header { padding: 15px 25px; background-color: #36393f; border-bottom: 1px solid #202225; z-index: 10; display: flex; justify-content: space-between; align-items: center;}
        #call-header h2 { margin: 0; color: white; font-size: 16px; }
        #controls { display: none; gap: 10px; align-items: center; }

        /* Ekran Paylaşımı */
        #video-container { flex-grow: 1; display: none; justify-content: center; align-items: center; padding: 20px; overflow: hidden; }
        #screen-video { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; }

        /* Yuvarlaklar */
        #participants-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; gap: 40px; padding: 40px; transition: all 0.3s ease; }
        .participant { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .circle { width: 110px; height: 110px; border-radius: 50%; background-color: #2f3136; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: white; border: 4px solid transparent; transition: all 0.2s; }
        .name-tag { background-color: rgba(0, 0, 0, 0.6); padding: 5px 15px; border-radius: 12px; font-size: 13px; color: white; }
        .speaking .circle { border-color: #3ba55d; box-shadow: 0 0 15px rgba(59, 165, 93, 0.7); }

        .minimized-participants { flex-grow: 0 !important; padding: 10px !important; background-color: #18191c; border-top: 1px solid #202225; }
        .minimized-participants .circle { width: 40px; height: 40px; font-size: 16px; border-width: 2px; }
        .minimized-participants .participant { gap: 5px; }
        .minimized-participants .name-tag { font-size: 10px; padding: 2px 6px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Profilin</h3>
        <input type="text" id="my-username" placeholder="Kullanıcı Adın (Örn: Juggernaut)">
        <button onclick="saveProfile()" class="btn-dark">Profili Kaydet</button>
        
        <h3>Durum: <span id="status-text" style="color: #faa61a;">Bağlanıyor...</span></h3>
        <div class="info-box" id="my-id">Yükleniyor...</div>
        <button onclick="copyMyId()">ID Kodumu Kopyala</button>

        <h3>Arkadaş Ekle</h3>
        <input type="text" id="new-friend-name" placeholder="Arkadaşın Adı">
        <input type="text" id="new-friend-id" placeholder="Arkadaşın ID Kodu">
        <button onclick="addFriend()" class="btn-dark">Listeye Ekle</button>

        <h3>Arkadaşlarım</h3>
        <ul id="friends-list">
            <!-- Kayıtlı arkadaşlar buraya gelecek -->
        </ul>
    </div>

    <div id="main">
        <div id="call-header">
            <h2 id="current-room-title">Bekleme Odası</h2>
            <div id="controls">
                <button id="mute-btn" onclick="toggleMute()" style="width: auto;">🎙️ Sustur</button>
                <select id="quality-selector" style="width: auto; margin: 0;">
                    <option value="360">360p (60fps)</option>
                    <option value="480">480p (60fps)</option>
                    <option value="720">720p (60fps)</option>
                    <option value="1080">1080p (60fps)</option>
                    <option value="1440" selected>2K (60fps)</option>
                </select>
                <button id="share-btn" onclick="startScreenShare()" class="btn-green" style="width: auto;">🖥️ Ekran Paylaş</button>
                <button id="leave-btn" onclick="endCall()" class="btn-red" style="width: auto;">☎️ Kapat</button>
            </div>
        </div>
        
        <div id="video-container">
            <video id="screen-video" autoplay playsinline></video>
        </div>

        <div id="participants-area">
            <!-- Yuvarlaklar -->
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        let peer;
        let myStream;
        let currentAudioCall;
        let remotePeerId = null; 
        let audioContext;
        let isMuted = false;
        let localUsername = localStorage.getItem('chat_username') || 'Sen';

        async function init() {
            document.getElementById('my-username').value = localUsername === 'Sen' ? '' : localUsername;
            loadFriends();

            try {
                // Mikrofonu al
                myStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });
                
                addParticipant(localUsername, localUsername.charAt(0).toUpperCase(), 'local-user');
                monitorSpeech(myStream, 'local-user');

                peer = new Peer(); 

                peer.on('open', function(id) {
                    document.getElementById('my-id').innerText = id;
                    document.getElementById('status-text').innerText = "Bağlantıya Hazır";
                    document.getElementById('status-text').style.color = "#3ba55d";
                });

                // Arama Geldiğinde
                peer.on('call', function(call) {
                    if (call.metadata && call.metadata.type === 'screen') {
                        call.answer(); 
                        call.on('stream', function(screenStream) {
                            showScreenVideo(screenStream, false);
                        });
                        call.on('close', hideScreenVideo);
                    } else {
                        remotePeerId = call.peer;
                        call.answer(myStream);
                        setupCallEvents(call, call.metadata ? call.metadata.callerName : 'Arkadaşın');
                    }
                });
            } catch (err) {
                alert("Mikrofon izni alınamadı!");
            }
        }

        // Aramayı Başlat
        function callFriend(friendId, friendName) {
            remotePeerId = friendId;
            document.getElementById('current-room-title').innerText = friendName + " Aranıyor...";
            const call = peer.call(friendId, myStream, { metadata: { type: 'audio', callerName: localUsername } });
            setupCallEvents(call, friendName);
        }

        function setupCallEvents(call, remoteName) {
            currentAudioCall = call;

            call.on('stream', function(remoteStream) {
                document.getElementById('current-room-title').innerText = remoteName + " ile Görüşülüyor";
                document.getElementById('controls').style.display = "flex";

                document.getElementById('remote-audio').srcObject = remoteStream;

                if(!document.getElementById('remote-user')) {
                    addParticipant(remoteName, remoteName.charAt(0).toUpperCase(), 'remote-user');
                    monitorSpeech(remoteStream, 'remote-user');
                }
            });

            call.on('close', endCallUI);
        }

        // Kendini Susturma
        function toggleMute() {
            isMuted = !isMuted;
            myStream.getAudioTracks()[0].enabled = !isMuted;
            const muteBtn = document.getElementById('mute-btn');
            
            if (isMuted) {
                muteBtn.innerText = "🔇 Sesim Kapalı";
                muteBtn.style.backgroundColor = "#ed4245";
            } else {
                muteBtn.innerText = "🎙️ Sustur";
                muteBtn.style.backgroundColor = "#5865F2";
            }
        }

        // Ekran Paylaşımı (Kalite Seçenekli)
        async function startScreenShare() {
            if (!remotePeerId) return alert("Önce sesli bağlantı kurmalısın.");
            
            const quality = document.getElementById('quality-selector').value;
            const resolutions = {
                '360': { w: 640, h: 360 },
                '480': { w: 854, h: 480 },
                '720': { w: 1280, h: 720 },
                '1080': { w: 1920, h: 1080 },
                '1440': { w: 2560, h: 1440 }
            };
            const res = resolutions[quality];

            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: res.w }, height: { ideal: res.h }, frameRate: { ideal: 60, max: 60 } },
                    audio: true
                });

                showScreenVideo(screenStream, true);
                const screenCall = peer.call(remotePeerId, screenStream, { metadata: { type: 'screen' } });

                screenStream.getVideoTracks()[0].onended = () => {
                    screenCall.close();
                    hideScreenVideo();
                };
            } catch (err) {
                console.error("Ekran paylaşılamadı:", err);
            }
        }

        function showScreenVideo(stream, isLocal) {
            const videoEl = document.getElementById('screen-video');
            videoEl.srcObject = stream;
            videoEl.muted = isLocal; 
            document.getElementById('video-container').style.display = 'flex';
            document.getElementById('participants-area').classList.add('minimized-participants');
        }

        function hideScreenVideo() {
            document.getElementById('screen-video').srcObject = null;
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('participants-area').classList.remove('minimized-participants');
        }

        function endCall() {
            if(currentAudioCall) currentAudioCall.close();
            endCallUI();
        }

        function endCallUI() {
            document.getElementById('current-room-title').innerText = "Bekleme Odası";
            document.getElementById('controls').style.display = "none";
            hideScreenVideo();
            let remoteNode = document.getElementById('remote-user');
            if(remoteNode) remoteNode.remove();
        }

        function addParticipant(name, initials, id) {
            const area = document.getElementById('participants-area');
            let div = document.createElement('div');
            div.className = 'participant';
            div.id = id;
            div.innerHTML = `<div class="circle">${initials}</div><div class="name-tag">${name}</div>`;
            area.appendChild(div);
        }

        function monitorSpeech(stream, elementId) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            source.connect(analyser); 
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            setInterval(() => {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let average = sum / dataArray.length;

                let el = document.getElementById(elementId);
                // Eğer kullanıcı kendini susturduysa kendi yeşil ışığını da yakma
                if(el) {
                    if (average > 15 && !(elementId === 'local-user' && isMuted)) el.classList.add('speaking');
                    else el.classList.remove('speaking');
                }
            }, 100);
        }

        // --- PROFİL VE ARKADAŞ SİSTEMİ (LocalStorage) ---
        function saveProfile() {
            const nameInput = document.getElementById('my-username').value.trim();
            if(nameInput) {
                localStorage.setItem('chat_username', nameInput);
                localUsername = nameInput;
                document.querySelector('#local-user .name-tag').innerText = localUsername;
                document.querySelector('#local-user .circle').innerText = localUsername.charAt(0).toUpperCase();
                alert("Profil kaydedildi!");
            }
        }

        function addFriend() {
            const name = document.getElementById('new-friend-name').value.trim();
            const id = document.getElementById('new-friend-id').value.trim();
            if(!name || !id) return alert("İsim ve ID boş bırakılamaz.");

            let friends = JSON.parse(localStorage.getItem('chat_friends') || '[]');
            friends.push({ name, id });
            localStorage.setItem('chat_friends', JSON.stringify(friends));
            
            document.getElementById('new-friend-name').value = '';
            document.getElementById('new-friend-id').value = '';
            loadFriends();
        }

        function loadFriends() {
            const list = document.getElementById('friends-list');
            list.innerHTML = '';
            let friends = JSON.parse(localStorage.getItem('chat_friends') || '[]');
            
            friends.forEach((friend, index) => {
                let li = document.createElement('li');
                li.className = 'friend-item';
                li.innerHTML = `
                    <span>${friend.name}</span>
                    <div>
                        <button onclick="callFriend('${friend.id}', '${friend.name}')">Ara</button>
                        <button onclick="deleteFriend(${index})" class="btn-red" style="padding: 5px;">Sil</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function deleteFriend(index) {
            let friends = JSON.parse(localStorage.getItem('chat_friends') || '[]');
            friends.splice(index, 1);
            localStorage.setItem('chat_friends', JSON.stringify(friends));
            loadFriends();
        }

        function copyMyId() {
            navigator.clipboard.writeText(document.getElementById('my-id').innerText);
            alert("ID Kodun kopyalandı!");
        }

        window.onload = init;
    </script>
</body>
</html>
